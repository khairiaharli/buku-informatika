<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Buku Digital Informatika | Kelas 7–9</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Buku Digital Pembelajaran Informatika Kelas 7, 8, dan 9">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css" />

  <style>
    :root {
      --theme-color: #0f766e;
    }

    .markdown-section {
      max-width: 820px;
      font-size: 16px;
      line-height: 1.75;
    }

    .global-watermark {
      position: fixed;
      bottom: 12px;
      right: 18px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(15, 118, 110, 0.42);
      pointer-events: none;
      user-select: none;
      z-index: 999;
      letter-spacing: 0.4px;
    }

    .page-footer-watermark {
      margin-top: 48px;
      padding-top: 14px;
      border-top: 1px solid #e5e7eb;
      text-align: center;
      font-size: 13px;
      color: #6b7280;
    }

    @media print {
      .sidebar, .sidebar-toggle, .pagination-item {
        display: none !important;
      }
      .content {
        left: 0 !important;
      }
      .global-watermark {
        color: rgba(0, 0, 0, 0.45);
      }
    }
  </style>
</head>
<body>
  <div id="app">Memuat buku digital...</div>

  <div class="global-watermark" aria-hidden="true">developed by Khairia Harli</div>

  <script>
    window.$docsify = {
      name: '📘 Informatika SMP',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,

      search: {
        placeholder: 'Cari materi atau istilah...',
        noData: 'Materi tidak ditemukan.',
        depth: 3
      },

      pagination: {
        previousText: '← Bab Sebelumnya',
        nextText: 'Bab Berikutnya →',
        crossChapter: true
      },

      mermaidConfig: {
        querySelector: '.mermaid'
      },

      plugins: [
        function (hook) {
          var footer = [
            '<footer class="page-footer-watermark">',
            'developed by Khairia Harli',
            '</footer>'
          ].join('');

          hook.afterEach(function (html) {
            return html + footer;
          });
        }
      ]
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Buku Digital Informatika | Kelas 7–9</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Buku Digital Pembelajaran Informatika Kelas 7, 8, dan 9">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css" />

  <style>
    :root {
      --theme-color: #105666;       /* Midnight green */
      --bg-beige: #F7F4D5;          /* Beige utama */
      --bg-beige-soft: #EFEBC4;     /* Beige sedikit lebih gelap untuk sidebar & kartu */
      --dark-green: #0A3323;        /* Dark green untuk teks & judul */
      --moss-green: #839958;        /* Moss green untuk aksen kotak & garis */
      --rosy-brown: #D3968C;        /* Rosy brown untuk sorotan hangat */
      --midnight-green: #105666;    /* Midnight green untuk tautan & header */
    }

    /* Latar belakang keseluruhan halaman */
    body,
    .content,
    .sidebar-toggle {
      background-color: var(--bg-beige) !important;
      color: var(--dark-green);
    }

/* Area Daftar Isi (Sidebar) */
    .sidebar {
      background-color: var(--midnight-green) !important;
      border-right: 3px solid var(--rosy-brown);
      color: var(--bg-beige);
    }

    .sidebar .app-name-link {
      color: var(--bg-beige) !important;
      font-weight: 700;
    }

    .sidebar ul li strong {
      color: var(--rosy-brown);
    }

    .sidebar ul li a {
      color: rgba(247, 244, 213, 0.9);
      font-size: 14.5px;
    }

    .sidebar ul li a:hover {
      color: var(--rosy-brown);
    }

    .sidebar ul li.active > a {
      color: var(--bg-beige) !important;
      font-weight: 700;
      border-right: 4px solid var(--rosy-brown);
      background-color: rgba(211, 150, 140, 0.25);
    }

    .sidebar-toggle {
      background-color: var(--bg-beige-soft) !important;
      border-radius: 0 8px 0 0;
    }

    .sidebar-toggle span {
      background-color: var(--dark-green) !important;
    }

    /* Hasil Pencarian di Sidebar */
    .matching-post {
      border-bottom: 1px solid rgba(247, 244, 213, 0.2) !important;
    }

    .matching-post h2 {
      color: var(--rosy-brown) !important;
    }

    .matching-post p {
      color: var(--bg-beige) !important;
    }

    /* Kolom Pencarian */
    .search {
      border-bottom: 1px solid rgba(247, 244, 213, 0.25) !important;
    }

    .search input {
      background-color: var(--bg-beige) !important;
      border: 2px solid var(--moss-green) !important;
      border-radius: 6px;
      color: var(--dark-green) !important;
    }

    .search input::placeholder {
      color: rgba(10, 51, 35, 0.55);
    }

    .search input::placeholder {
      color: rgba(10, 51, 35, 0.55);
    }

    /* Kenyamanan membaca di area konten utama */
    .markdown-section {
      max-width: 820px;
      font-size: 16px;
      line-height: 1.75;
      color: var(--dark-green);
    }

    .markdown-section h1 {
      color: var(--dark-green);
      border-bottom: 2px solid var(--moss-green);
      padding-bottom: 8px;
    }

    .markdown-section h2 {
      color: var(--midnight-green);
      border-bottom: 1px solid rgba(131, 153, 88, 0.45);
      padding-bottom: 6px;
    }

    .markdown-section h3,
    .markdown-section h4 {
      color: var(--dark-green);
    }

    .markdown-section strong {
      color: var(--dark-green);
    }

    .markdown-section a {
      color: var(--midnight-green);
      font-weight: 600;
    }

    .markdown-section hr {
      border: none;
      border-top: 1px solid var(--rosy-brown);
      margin: 28px 0;
    }

/* Kotak Kutipan / Info Penting (Blockquote) */
    .markdown-section blockquote {
      border-left: 5px solid var(--rosy-brown);
      background-color: rgba(211, 150, 140, 0.26);
      color: var(--dark-green);
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
    }

    /* Tabel Materi & Perbandingan */
    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
    }

    .markdown-section table th {
      background-color: var(--midnight-green);
      color: var(--bg-beige);
      border: 1px solid var(--midnight-green);
      font-weight: 600;
    }

    .markdown-section table td {
      border: 1px solid rgba(10, 51, 35, 0.22);
      color: var(--dark-green);
    }

    .markdown-section table tr {
      background-color: var(--bg-beige) !important;
    }

    .markdown-section table tr:nth-child(2n) {
      background-color: rgba(131, 153, 88, 0.12) !important;
    }

    /* Blok Kode & Pseudocode */
    .markdown-section code {
      background-color: rgba(211, 150, 140, 0.28);
      color: var(--dark-green);
      border-radius: 4px;
      padding: 2px 6px;
    }

    .markdown-section pre {
      background-color: var(--bg-beige-soft) !important;
      border-left: 4px solid var(--midnight-green);
      border-radius: 6px;
    }

    .markdown-section pre > code {
      background-color: transparent !important;
      color: var(--dark-green) !important;
    }

    /* Kotak Pembahasan Buka-Tutup (<details>) */
    .markdown-section details {
      background-color: rgba(211, 150, 140, 0.18);
      border: 1px solid var(--rosy-brown);
      border-radius: 8px;
      padding: 10px 14px;
      margin: 14px 0;
    }

    .markdown-section details summary {
      cursor: pointer;
      color: var(--midnight-green);
    }

    /* Tombol Navigasi Bab (Prev / Next) */
    .docsify-pagination-container {
      border-top: 1px solid var(--rosy-brown) !important;
    }

    .pagination-item-label,
    .pagination-item-title {
      color: var(--midnight-green) !important;
    }

    /* Watermark Permanen di Pojok Kanan Bawah */
    .global-watermark {
      position: fixed;
      bottom: 12px;
      right: 18px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(16, 86, 102, 0.55);
      pointer-events: none;
      user-select: none;
      z-index: 999;
      letter-spacing: 0.4px;
    }

    /* Footer Otomatis di Bawah Setiap Halaman */
    .page-footer-watermark {
      margin-top: 48px;
      padding-top: 14px;
      border-top: 1px solid var(--rosy-brown);
      text-align: center;
      font-size: 13px;
      color: var(--midnight-green);
      font-weight: 500;
    }

    /* Pengaturan Cetak PDF */
    @media print {
      body, .content, .markdown-section {
        background-color: #ffffff !important;
        color: #000000 !important;
      }
      .sidebar, .sidebar-toggle, .pagination-item {
        display: none !important;
      }
      .content {
        left: 0 !important;
      }
      .global-watermark {
        color: rgba(0, 0, 0, 0.45);
      }
    }
  </style>
</head>
<body>
  <div id="app">Memuat buku digital...</div>

  <div class="global-watermark" aria-hidden="true">developed by Khairia Harli</div>

  <script>
    window.$docsify = {
      name: '📘 Informatika SMP',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,

      search: {
        placeholder: 'Cari materi atau istilah...',
        noData: 'Materi tidak ditemukan.',
        depth: 3
      },

      pagination: {
        previousText: '← Bab Sebelumnya',
        nextText: 'Bab Berikutnya →',
        crossChapter: true
      },

      mermaidConfig: {
        querySelector: '.mermaid'
      },

      plugins: [
        function (hook) {
          var footer = [
            '<footer class="page-footer-watermark">',
            'developed by Khairia Harli',
            '</footer>'
          ].join('');

          hook.afterEach(function (html) {
            return html + footer;
          });
        }
      ]
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
</body>
</html>
